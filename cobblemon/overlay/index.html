<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX Cobblemon Overlay</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Inter,system-ui,sans-serif;padding:18px}.bar{width:100%;min-height:175px;border:1px solid rgba(32,216,255,.48);border-radius:18px;background:linear-gradient(135deg,rgba(5,12,23,.96),rgba(10,27,44,.92));box-shadow:0 16px 44px rgba(0,0,0,.28);padding:14px 18px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:950;font-style:italic;letter-spacing:.12em}.head span:last-child{font-size:.75rem;color:#85eaff}.team{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:8px}.mon{text-align:center;min-width:0}.visual{height:77px;margin:auto;display:grid;place-items:end center;color:#657b97;font-weight:900}.visual img{max-width:98px;max-height:74px;object-fit:contain;filter:drop-shadow(0 9px 10px rgba(0,0,0,.38))}.name{font-size:.7rem;font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.species{font-size:.53rem;color:#8494a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lives{font-size:.86rem;color:#ff6474;margin-top:2px;letter-spacing:.04em}.dead{opacity:.45;filter:saturate(.5)}@media(max-width:700px){.team{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="bar"><div class="head"><span id="region">HOENN</span><span id="gym">GIMNASIO 1</span></div><div class="team" id="team"></div></div><script src="../../js/storage.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function img(p,state){const slug=p.slug||String(p.species||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');const arr=[state.imageOverrides?.[slug],p.customImage,p.image,p.autoImage,p.fallbackImage,...(p.imageCandidates||[])].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);if(!arr.length)return '—';return `<img src="${esc(arr[0])}" data-i="0" data-c="${esc(encodeURIComponent(JSON.stringify(arr)))}" onerror="let a=JSON.parse(decodeURIComponent(this.dataset.c)),i=+this.dataset.i+1;if(i<a.length){this.dataset.i=i;this.src=a[i]}else this.outerHTML='—'">`}
function render(){const state=FXStorage.get('cobblemon.state',{currentRegion:'Hoenn',currentGym:1,pokemon:[]});const max=Math.max(1,Number(state.regionSettings?.[state.currentRegion]?.maxLives)||3);document.getElementById('region').textContent=state.currentRegion.toUpperCase();document.getElementById('gym').textContent='GIMNASIO '+state.currentGym;const mons=(state.pokemon||[]).filter(p=>p.region===state.currentRegion&&p.inTeam).slice(0,6);document.getElementById('team').innerHTML=Array.from({length:6},(_,i)=>{const p=mons[i];return p?`<div class="mon ${Number(p.lives)===0?'dead':''}"><div class="visual">${img(p,state)}</div><div class="name">${esc(p.nickname||p.species)}</div><div class="species">${esc(p.species)}</div><div class="lives">${'♥'.repeat(Number(p.lives))}${'♡'.repeat(Math.max(0,max-Number(p.lives)))}</div></div>`:`<div class="mon"><div class="visual">—</div><div class="name">VACÍO</div><div class="species">—</div><div class="lives">${'♡'.repeat(max)}</div></div>`}).join('')}
render();window.addEventListener('storage',render);window.addEventListener('fx-storage-change',render);setInterval(render,1000);
</script></body></html>
