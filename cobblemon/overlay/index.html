<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX Cobblemon Overlay</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Inter,system-ui,sans-serif;padding:18px}.bar{width:100%;min-height:165px;border:1px solid rgba(32,216,255,.5);border-radius:18px;background:linear-gradient(135deg,rgba(5,12,23,.96),rgba(10,27,44,.92));box-shadow:0 16px 44px rgba(0,0,0,.28);padding:16px 18px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:950;font-style:italic;letter-spacing:.12em}.head span:last-child{font-size:.75rem;color:#85eaff}.team{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}.mon{text-align:center;min-width:0}.visual{width:62px;height:62px;border-radius:50%;margin:auto;background:#101a29;border:1px solid #37516f;display:grid;place-items:center;color:#657b97;font-weight:900;overflow:hidden}.visual img{max-width:100%;max-height:100%;object-fit:contain}.name{font-size:.72rem;font-weight:900;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lives{font-size:.8rem;color:#ff6474;margin-top:2px}@media(max-width:700px){.team{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="bar"><div class="head"><span id="region">HOENN</span><span id="gym">GIMNASIO 1</span></div><div class="team" id="team"></div></div><script src="../../js/storage.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function render(){const state=FXStorage.get('cobblemon.state',{currentRegion:'Hoenn',currentGym:1,pokemon:[]});document.getElementById('region').textContent=state.currentRegion.toUpperCase();document.getElementById('gym').textContent='GIMNASIO '+state.currentGym;const mons=state.pokemon.filter(p=>p.region===state.currentRegion&&p.inTeam).slice(0,6);document.getElementById('team').innerHTML=Array.from({length:6},(_,i)=>{const p=mons[i];return p?`<div class="mon"><div class="visual">${p.image?`<img src="${esc(p.image)}">`:'PK'}</div><div class="name">${esc(p.nickname||p.species)}</div><div class="lives">${'♥'.repeat(p.lives)}${'♡'.repeat(3-p.lives)}</div></div>`:'<div class="mon"><div class="visual">—</div><div class="name">VACÍO</div><div class="lives">♡♡♡</div></div>'}).join('')}
render();window.addEventListener('storage',render);window.addEventListener('fx-storage-change',render);setInterval(render,1000);
</script></body></html>
